spring.application.name=api

# Kafka productor: broker de la red interna de docker (definido en docker-compose.yml)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# DynamoDB: region y limite de mensajes por tabla (endpoint GET /mensajes)
app.dynamodb.region=${AWS_REGION:us-east-2}
app.mensajes.tablas=pagos,notificaciones,analiticas
